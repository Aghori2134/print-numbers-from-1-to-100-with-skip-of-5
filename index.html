<!DOCTYPE html>
<html>

<head>
    <title>While Loop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        div {
            width: 300px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        p {
            width: 150px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #e8e8e8;
            border-radius: 10px;

            font-size: 35px;
            font-weight: bold;
            color: #333;
        }

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color:#555;
        }
    </style>
</head>

<body>

    <div>

        <p id="output">0</p>

        <button onclick="numbers()">Click</button>

    </div>


    <script>

        let a = 1;

        function numbers() {

            if (a%5==0) {
                document.getElementById("output").innerHTML = "skip";
            }  
            else {
                document.getElementById("output").innerHTML = a;
            }
            a++;
			 
            while (a>100) {
                a = 1;
            }

        }

    </script>

</body>

</html>
